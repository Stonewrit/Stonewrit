# Local stack: Postgres, a one-shot migration job, and the server.
#
#   docker compose up --build
#
# The server starts only after the database is healthy and migrations have run.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stonewrit
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stonewrit"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build: .
    entrypoint: ["/app/stonewrit", "migrate", "up"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/stonewrit?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/stonewrit?sslmode=disable
      PORT: "3002"
      LOG_LEVEL: info
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
