# GoReleaser configuration. https://goreleaser.com
#
# Ships the standalone verifier so anyone can download a binary and check a
# Stonewrit evidence bundle without building from source.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: verify
    main: ./cmd/verify
    binary: stonewrit-verify
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: verify
    ids:
      - verify
    name_template: "stonewrit-verify_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: true
