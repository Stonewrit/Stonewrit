# golangci-lint configuration. See https://golangci-lint.run for details.
run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gofmt
    - goimports
    - unconvert
    - bodyclose

linters-settings:
  goimports:
    local-prefixes: github.com/stonewrit/stonewrit
  misspell:
    locale: US
  revive:
    rules:
      - name: package-comments
        disabled: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Generated code is not ours to lint.
    - path: server/internal/queries/gen/
      linters:
        - all
