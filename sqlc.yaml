version: "2"
sql:
  - engine: postgresql
    queries: "server/internal/queries"
    schema: "server/migrations"
    gen:
      go:
        package: "queries"
        out: "server/internal/queries/gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
